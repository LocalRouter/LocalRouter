name: Deploy Website to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'website/**'
      - 'src/**'
      - 'public/icons/**'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - '.npmrc'
      - '.github/workflows/deploy-website.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            website/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install website dependencies
        working-directory: ./website
        run: npm ci

      - name: Build
        working-directory: ./website
        run: npm run build:check

      - name: Add CNAME file
        working-directory: ./website/dist
        run: echo "localrouter.ai" > CNAME

      - name: Add 404.html and SPA route indexes
        working-directory: ./website/dist
        run: |
          cp index.html 404.html
          mkdir -p demo docs research download research/decision-model-routing
          for dir in demo docs research download research/decision-model-routing; do
            cp index.html "$dir/index.html"
          done

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./website/dist

  deploy:
    environment:
      name: github-pages
      url: https://localrouter.ai
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

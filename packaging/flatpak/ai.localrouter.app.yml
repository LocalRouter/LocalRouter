# Flatpak manifest for LocalRouter.
#
# Built per-architecture by the `build-flatpak` job in
# .github/workflows/release.yml and published to LocalRouter's OWN flatpak
# repository (packaging/linux-repo/build-flatpak-repo.sh, served from
# https://packages.localrouter.ai/flatpak) — the flatpak equivalent of a
# Homebrew tap, with no external review gate. Users add the remote once and
# `flatpak update` works from then on.
#
# The same manifest is Flathub-ready: submitting to flathub/flathub later is
# optional extra reach, not a requirement. The app id matches the
# localrouter.ai domain, which is what Flathub's ownership check requires.
#
# `__VERSION__` / `__SHA256_AMD64__` / `__SHA256_ARM64__` are substituted by
# scripts/publish-packages.sh.
#
# NOTE: `runtime-version` must be a currently-supported runtime. Verify
# against https://docs.flatpak.org/en/latest/available-runtimes.html when
# bumping — an EOL runtime stops getting security fixes (and is an automatic
# rejection if this is ever submitted to Flathub).
app-id: ai.localrouter.app
branch: stable
runtime: org.gnome.Platform
runtime-version: '48'
sdk: org.gnome.Sdk
command: localrouter

finish-args:
  # Providers are remote HTTP APIs; the local gateway listens on localhost.
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri

  # LocalRouter lives in the system tray (libayatana-appindicator, built
  # below) — without this the window can only be reached from the app grid.
  # See tauri-apps/tauri#13599 for the Tauri-side bug this works around.
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.secrets

  # THE IMPORTANT ONE. LocalRouter's core job is proxying to MCP stdio servers
  # (`npx`, `uvx`) and driving coding agents (`claude`, `aider`) that live on
  # the host. `crates/lr-utils/src/sandbox.rs` rewrites every spawn to go
  # through `flatpak-spawn --host`, which needs this name. Without it the MCP
  # gateway and the coding-agent features are entirely non-functional.
  #
  # Flathub reviewers treat this as a sandbox hole and will ask about it. The
  # answer is the VS Code / GNOME Builder precedent: a developer tool whose
  # purpose is running the user's toolchain cannot be meaningfully confined.
  - --talk-name=org.freedesktop.Flatpak

  # Agent configs (~/.claude, ~/.aider.conf.yml) and the user's project
  # directories, which agents are pointed at.
  - --filesystem=home

modules:
  # The tray icon: Tauri's tray backend dlopen()s libayatana-appindicator3 at
  # run time, and the GNOME runtime does not ship it (nor libdbusmenu or the
  # other Ayatana libraries). Without it the app runs with no tray icon.
  #
  # Mirrors flathub/shared-modules
  # libayatana-appindicator/libayatana-appindicator-gtk3.json (and the
  # intltool-0.51.json it pulls in) at shared-modules commit cb9ec602, inlined
  # because only this manifest and the files under patches/ are rendered into
  # the build directory (scripts/publish-packages.sh). The patches are
  # shared-modules' own, copied verbatim into patches/.
  - name: libayatana-appindicator
    buildsystem: cmake-ninja
    cleanup:
      - /include
      - /lib/pkgconfig
    config-opts:
      # CMake's GNUInstallDirs picks lib64 in the GNOME SDK, where neither
      # pkg-config (for the modules below) nor the app's dlopen() look.
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DENABLE_BINDINGS_MONO=NO
      - -DENABLE_BINDINGS_VALA=NO
      - -DENABLE_GTKDOC=NO
    modules:
      # Build-time only (libdbusmenu's autotools build); removed afterwards.
      - name: intltool
        cleanup:
          - '*'
        sources:
          - type: archive
            url: https://launchpad.net/intltool/trunk/0.51.0/+download/intltool-0.51.0.tar.gz
            mirror-urls:
              - https://sources.suse.com/SUSE:SLE-15-SP7:Update:BCI/000product/ca527df4d03bf96a67854a8ed2f0c64b/INCLUDED/SUSE:SLE-15-SP6:GA::intltool::45f77273c3f2ef792fa697b444183beb/intltool-0.51.0.tar.gz
              - https://mirror-hk.koddos.net/lfs/lfs-packages/12.0/intltool-0.51.0.tar.gz
              - https://gstreamer.freedesktop.org/src/mirror/intltool-0.51.0.tar.gz
            sha256: 67c74d94196b153b774ab9f89b2fa6c6ba79352407037c8c14d5aeb334e959cd
          - type: patch
            path: patches/intltool-perl5.26-regex-fixes.patch

      - name: libdbusmenu
        buildsystem: autotools
        build-options:
          cflags: -Wno-error
        cleanup:
          - '*.la'
          - /include
          - /lib/pkgconfig
          - /libexec
          - /share/doc
          - /share/gtk-doc
        config-opts:
          - --with-gtk=3
          - --disable-dumper
          - --disable-static
          - --disable-tests
          - --disable-gtk-doc
          - --enable-introspection=no
          - --disable-vala
        sources:
          - type: archive
            url: https://launchpad.net/libdbusmenu/16.04/16.04.0/+download/libdbusmenu-16.04.0.tar.gz
            mirror-urls:
              - https://sources.suse.com/SUSE:SLFO:Main:Build/libdbusmenu/a5b3e4717f09f90f9cd5568a5f933e8d/libdbusmenu-16.04.0.tar.gz
              - https://mirror.math.princeton.edu/pub/frugalware/frugalware-2.1/source/xlib/libdbusmenu/libdbusmenu-16.04.0.tar.gz
              - https://ftp.fr.openbsd.org/pub/OpenBSD/distfiles/libdbusmenu-16.04.0.tar.gz
            sha256: b9cc4a2acd74509435892823607d966d424bd9ad5d0b00938f27240a1bfa878a
          - type: patch
            path: patches/libdbusmenu-0001-Fix-HAVE_VALGRIND-AM_CONDITIONAL.patch

      - name: ayatana-ido
        buildsystem: cmake-ninja
        cleanup:
          - /include
          - /lib/pkgconfig
        config-opts:
          - -DCMAKE_INSTALL_LIBDIR=lib
          - -DENABLE_INTROSPECTION=OFF
        sources:
          - type: git
            url: https://github.com/AyatanaIndicators/ayatana-ido.git
            tag: 0.10.4
            commit: f968079b09e2310fefc3fc307359025f1c74b3eb
          - type: patch
            path: patches/ayatana-ido-0001-Make-introspection-configurable.patch

      - name: libayatana-indicator
        buildsystem: cmake-ninja
        cleanup:
          - /include
          - /lib/pkgconfig
          - /libexec
          - /share
        config-opts:
          - -DCMAKE_INSTALL_LIBDIR=lib
        sources:
          - type: git
            url: https://github.com/AyatanaIndicators/libayatana-indicator.git
            tag: 0.9.4
            commit: 611bb384b73fa6311777ba4c41381a06f5b99dad

    sources:
      - type: git
        url: https://github.com/AyatanaIndicators/libayatana-appindicator.git
        tag: 0.5.94
        commit: 31e8bb083b307e1cc96af4874a94707727bd1e79

  - name: localrouter
    buildsystem: simple
    build-commands:
      # Unpack the released .deb rather than rebuilding: a Tauri build needs
      # node plus a full npm install, which Flathub's offline builders cannot
      # do without vendoring the entire npm tree.
      - ar x localrouter.deb
      - tar -xf data.tar.gz
      - install -Dm755 usr/bin/localrouter /app/bin/localrouter
      - install -Dm644 usr/share/applications/*.desktop
        /app/share/applications/ai.localrouter.app.desktop
      - |
        for size in 32x32 128x128 256x256@2; do
          src="usr/share/icons/hicolor/${size}/apps/localrouter.png"
          if [ -f "$src" ]; then
            install -Dm644 "$src" \
              "/app/share/icons/hicolor/${size}/apps/ai.localrouter.app.png"
          fi
        done
      - install -Dm644 ai.localrouter.app.metainfo.xml
        /app/share/metainfo/ai.localrouter.app.metainfo.xml
      # Marker read by crates/lr-utils/src/install_source.rs. Flatpak is also
      # detected from /.flatpak-info, so this is belt-and-braces — but it keeps
      # the reported source correct if the app is ever run with FLATPAK_ID
      # cleared.
      - echo flatpak | install -Dm644 /dev/stdin /app/share/localrouter/install-source
      # Rewrite Exec/Icon to the flatpak app id.
      - desktop-file-edit --set-key=Exec --set-value='localrouter %U'
        --set-icon=ai.localrouter.app
        /app/share/applications/ai.localrouter.app.desktop

    sources:
      - type: file
        only-arches: [x86_64]
        url: https://github.com/LocalRouter/LocalRouter/releases/download/v__VERSION__/LocalRouter___VERSION___amd64.deb
        sha256: __SHA256_AMD64__
        dest-filename: localrouter.deb
      - type: file
        only-arches: [aarch64]
        url: https://github.com/LocalRouter/LocalRouter/releases/download/v__VERSION__/LocalRouter___VERSION___arm64.deb
        sha256: __SHA256_ARM64__
        dest-filename: localrouter.deb
      - type: file
        path: ai.localrouter.app.metainfo.xml
